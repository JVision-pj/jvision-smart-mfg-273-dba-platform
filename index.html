<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>資料庫管理平台（DBA Platform）｜Jvision 系統 Demo</title>
  <meta name="description" content="資料庫效能監控、慢查詢調校、容量與備份、版本修補的一站式 DBA 平台" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
  <style>
    :root{
      --accent:#0369a1; --accent2:#38bdf8; --accent-soft:#e0f2fe;
      --ink:#0f2233; --muted:#5b7385; --line:#e2e8f0; --bg:#f1f5f9; --card:#ffffff;
      --ok:#059669; --warn:#d97706; --bad:#dc2626; --soft:#f8fafc;
      --shadow:0 1px 3px rgba(2,44,66,.06),0 8px 24px rgba(2,44,66,.05);
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{font-family:"Inter","Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.55}
    .material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;vertical-align:middle}
    .layout{display:flex;min-height:100vh;align-items:stretch}
    /* sidebar */
    .side{width:250px;flex:0 0 250px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;min-width:0}
    .brand{padding:20px 20px 16px;border-bottom:1px solid var(--line)}
    .brand-row{display:flex;align-items:center;gap:11px}
    .logo{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#fff;flex:0 0 40px}
    .logo .material-symbols-outlined{font-size:24px}
    .brand-t{font-weight:900;font-size:15px;letter-spacing:.2px}
    .brand-s{font-size:11.5px;color:var(--muted);font-weight:600}
    .nav{padding:12px 12px 8px;display:flex;flex-direction:column;gap:4px;overflow:auto}
    .nav-lab{font-size:11px;font-weight:800;color:#94a3b8;letter-spacing:1px;padding:8px 10px 4px}
    .nav button{display:flex;align-items:center;gap:11px;width:100%;border:0;background:transparent;color:var(--muted);font-family:inherit;font-size:14px;font-weight:600;padding:10px 12px;border-radius:10px;cursor:pointer;text-align:left;min-width:0}
    .nav button .material-symbols-outlined{font-size:21px;flex:0 0 auto}
    .nav button .nlab{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .nav button:hover{background:var(--soft);color:var(--ink)}
    .nav button.on{background:var(--accent);color:#fff;box-shadow:0 6px 16px rgba(3,105,161,.28)}
    .nav button.on .material-symbols-outlined{color:#fff}
    .side-foot{margin-top:auto;padding:14px 18px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted)}
    .side-foot b{color:var(--ink)}
    /* main */
    .main{flex:1;min-width:0;display:flex;flex-direction:column}
    .topbar{background:#fff;border-bottom:1px solid var(--line);padding:15px 26px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
    .tb-l{min-width:0}
    .tb-l h1{margin:0;font-size:18px;font-weight:900;letter-spacing:.2px}
    .tb-l p{margin:2px 0 0;font-size:12.5px;color:var(--muted);font-weight:600}
    .tb-r{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .pill{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:12px;padding:6px 11px;border-radius:999px}
    .pill.g{background:#dcfce7;color:#047857}
    .pill .material-symbols-outlined{font-size:16px}
    .content{padding:22px 26px 40px;max-width:1280px;width:100%}
    .screen{animation:fade .25s ease}
    @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
    /* generic */
    .grid{display:grid;gap:16px;min-width:0}
    .k4{grid-template-columns:repeat(4,1fr)}
    .k3{grid-template-columns:repeat(3,1fr)}
    .k2{grid-template-columns:repeat(2,1fr)}
    .c23{grid-template-columns:1.6fr 1fr}
    .c32{grid-template-columns:1fr 1.5fr}
    .card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:17px 18px;box-shadow:var(--shadow);min-width:0}
    .card.pad0{padding:0;overflow:hidden}
    .ch{display:flex;align-items:center;gap:9px;margin-bottom:14px;min-width:0}
    .ch h3{margin:0;font-size:14.5px;font-weight:800}
    .ch .material-symbols-outlined{font-size:19px;color:var(--accent)}
    .ch .sub{font-size:11.5px;color:var(--muted);font-weight:600}
    .ch .r{margin-left:auto;font-size:11.5px;color:var(--muted);font-weight:700}
    .kpi .lab{font-size:12px;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:6px}
    .kpi .lab .material-symbols-outlined{font-size:17px}
    .kpi .val{font-size:27px;font-weight:900;margin-top:8px;letter-spacing:-.5px}
    .kpi .val small{font-size:13px;font-weight:800;color:var(--muted);margin-left:2px}
    .kpi .dt{font-size:11.5px;font-weight:700;margin-top:6px;display:inline-flex;align-items:center;gap:4px}
    .kpi .dt .material-symbols-outlined{font-size:15px}
    .up{color:var(--ok)} .down{color:var(--bad)} .flat{color:var(--muted)}
    .bar{height:6px;border-radius:6px;background:var(--line);margin-top:11px;overflow:hidden}
    .bar>i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
    table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
    th{text-align:left;font-size:11px;letter-spacing:.4px;color:var(--muted);font-weight:800;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--soft);white-space:nowrap}
    td{padding:11px 12px;border-bottom:1px solid #eef2f6;vertical-align:middle}
    tr:last-child td{border-bottom:0}
    tbody tr:hover{background:#f7fafc}
    .mono{font-family:"Inter",monospace;font-variant-numeric:tabular-nums}
    .tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap}
    .t-ok{background:#dcfce7;color:#047857}.t-warn{background:#fef3c7;color:#b45309}.t-bad{background:#fee2e2;color:#b91c1c}.t-info{background:var(--accent-soft);color:var(--accent)}.t-mut{background:#eef2f6;color:#64748b}
    .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:middle}
    .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
    .chart{width:100%;min-width:0;overflow:hidden}
    /* db instance list (signature-ish) */
    .inst{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid #eef2f6;min-width:0}
    .inst:last-child{border-bottom:0}
    .inst .ic{width:38px;height:38px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:0 0 38px}
    .inst .nm{font-weight:800;font-size:13.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .inst .mt{font-size:11.5px;color:var(--muted);font-weight:600}
    .inst .rt{margin-left:auto;text-align:right;flex:0 0 auto}
    .heat{display:flex;gap:3px;flex-wrap:wrap}
    .heat i{width:15px;height:15px;border-radius:3px;display:block}
    /* board */
    .board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;min-width:0}
    .col{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:11px;min-width:0}
    .col-h{font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;color:var(--muted)}
    .col-h .cnt{background:#fff;border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:11px}
    .tk{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 11px;margin-bottom:9px;box-shadow:0 1px 2px rgba(2,44,66,.04)}
    .tk:last-child{margin-bottom:0}
    .tk .tt{font-weight:800;font-size:12.5px;display:flex;align-items:center;gap:6px}
    .tk .tm{font-size:11px;color:var(--muted);font-weight:600;margin-top:5px;display:flex;justify-content:space-between;gap:8px}
    /* timeline */
    .tl{position:relative;padding-left:22px}
    .tl:before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line)}
    .tl-i{position:relative;padding:0 0 16px}
    .tl-i:last-child{padding-bottom:0}
    .tl-i:before{content:"";position:absolute;left:-19px;top:3px;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--accent2)}
    .tl-i.done:before{background:var(--accent);border-color:var(--accent)}
    .tl-i.warn:before{border-color:var(--warn)}
    .tl-t{font-weight:800;font-size:13px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .tl-m{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:3px}
    .sqlbox{background:#0b2233;color:#cbe7f5;border-radius:10px;padding:12px 14px;font-family:monospace;font-size:12px;line-height:1.7;overflow-x:auto;white-space:pre}
    .sqlbox .kw{color:#7dd3fc;font-weight:700}
    .sqlbox .warn{color:#fbbf24}
    .rec{display:flex;gap:10px;padding:11px 0;border-bottom:1px dashed var(--line)}
    .rec:last-child{border-bottom:0}
    .rec .ri{width:30px;height:30px;border-radius:8px;background:#dcfce7;color:#047857;display:flex;align-items:center;justify-content:center;flex:0 0 30px}
    .rec .rt{font-weight:800;font-size:12.5px}
    .rec .rd{font-size:11.5px;color:var(--muted);font-weight:600}
    .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;font-weight:700;color:var(--muted);margin-top:6px}
    .legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:middle}
    .flow-note{background:var(--accent-soft);border:1px solid #bae6fd;border-radius:12px;padding:12px 15px;font-size:12.5px;font-weight:600;color:#075985;display:flex;gap:9px;align-items:flex-start}
    .flow-note .material-symbols-outlined{font-size:19px;color:var(--accent);flex:0 0 auto}
    .gauge-wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
    .stat-list{display:flex;flex-direction:column;gap:11px}
    .stat-row{display:flex;align-items:center;gap:10px;font-size:12.5px;min-width:0}
    .stat-row .nm{font-weight:700;flex:0 0 118px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .stat-row .bg{flex:1;height:8px;background:var(--line);border-radius:8px;overflow:hidden;min-width:0}
    .stat-row .bg>i{display:block;height:100%;border-radius:8px}
    .stat-row .vv{flex:0 0 auto;font-weight:800;font-variant-numeric:tabular-nums}
    /* responsive */
    @media(max-width:1120px){.k4{grid-template-columns:repeat(2,1fr)}.board{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:860px){
      .layout{display:block}
      .side{position:static;width:auto;height:auto;flex:none;border-right:0;border-bottom:1px solid var(--line)}
      .brand{border-bottom:1px solid var(--line)}
      .nav{flex-direction:row;flex-wrap:wrap;overflow:visible;padding:10px}
      .nav-lab{display:none}
      .nav button{width:auto}
      .side-foot{display:none}
    }
    @media(max-width:820px){
      .k4,.k3,.k2,.c23,.c32,.board{grid-template-columns:1fr}
      .content{padding:18px 15px 34px}
      .topbar{padding:13px 15px}
    }
    @media(max-width:560px){
      .nav button .nlab{display:none}
      .nav button{padding:9px 11px}
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="side">
      <div class="brand">
        <div class="brand-row">
          <div class="logo"><span class="material-symbols-outlined">database</span></div>
          <div>
            <div class="brand-t">DBA Platform</div>
            <div class="brand-s">資料庫管理平台</div>
          </div>
        </div>
      </div>
      <nav class="nav" id="nav">
        <div class="nav-lab">維運模組</div>
        <button data-i="0" class="on"><span class="material-symbols-outlined">account_tree</span><span class="nlab">資料庫納管</span></button>
        <button data-i="1"><span class="material-symbols-outlined">monitoring</span><span class="nlab">效能監控</span></button>
        <button data-i="2"><span class="material-symbols-outlined">insights</span><span class="nlab">慢查詢分析</span></button>
        <button data-i="3"><span class="material-symbols-outlined">inventory_2</span><span class="nlab">容量管理</span></button>
        <button data-i="4"><span class="material-symbols-outlined">shield</span><span class="nlab">備份與還原</span></button>
        <button data-i="5"><span class="material-symbols-outlined">history</span><span class="nlab">版本修補</span></button>
      </nav>
      <div class="side-foot">
        納管實例 <b>42</b> ｜ 可用率 <b>99.98%</b><br/>資料為展示用途，非真實環境。
      </div>
    </aside>
    <div class="main">
      <div class="topbar">
        <div class="tb-l">
          <h1 id="tt">資料庫納管</h1>
          <p id="ts">實例清冊、效能基準與納管狀態</p>
        </div>
        <div class="tb-r">
          <span class="pill g"><span class="material-symbols-outlined">check_circle</span>健康 38</span>
          <span class="pill"><span class="material-symbols-outlined">schedule</span>2026-08-14</span>
        </div>
      </div>
      <div class="content"><div id="view"></div></div>
    </div>
  </div>

<script>
(function(){
  "use strict";
  var view=document.getElementById("view");
  var titleEl=document.getElementById("tt");
  var subEl=document.getElementById("ts");
  var META=[
    ["資料庫納管","實例清冊、效能基準與納管狀態"],
    ["效能監控","即時效能指標與分級告警"],
    ["慢查詢分析","SQL 剖析、執行計畫與索引建議"],
    ["容量管理","儲存成長、預測與擴充排程"],
    ["備份與還原","備份任務、驗證與 DR 演練"],
    ["版本修補","修補排程、版本分佈與變更紀錄"]
  ];
  var charts=[];
  function clearCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy();}catch(e){}}charts=[];}
  function mk(id,opt){var el=document.getElementById(id);if(!el)return;var base={chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},toolbar:{show:false},fontFamily:'Inter,"Noto Sans TC",sans-serif'}};opt.chart=Object.assign(base.chart,opt.chart||{});try{var c=new ApexCharts(el,opt);c.render();charts.push(c);}catch(e){}}
  var ACC="#0369a1",ACC2="#38bdf8";

  function esc(s){return String(s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
  function tbl(head,rows){var h='<div class="scroll"><table><thead><tr>';for(var i=0;i<head.length;i++)h+='<th>'+head[i]+'</th>';h+='</tr></thead><tbody>';for(var r=0;r<rows.length;r++){h+='<tr>';for(var c=0;c<rows[r].length;c++)h+='<td>'+rows[r][c]+'</td>';h+='</tr>';}return h+'</tbody></table></div>';}

  // ---------- SCREEN 0 : 資料庫納管 ----------
  function s0(){
    var inst=[
      {n:"CRM_PROD_MSSQL",e:"商用資料庫 B 2022",r:"主庫",v:0.62,st:"健康"},
      {n:"ERP_CORE_ORA",e:"商用資料庫 A 19c",r:"主庫",v:0.78,st:"觀察"},
      {n:"BILLING_PG",e:"PostgreSQL 15",r:"讀寫分離",v:0.45,st:"健康"},
      {n:"WMS_MYSQL",e:"MySQL 8.0",r:"主從",v:0.88,st:"告警"},
      {n:"ANALYTICS_PG",e:"PostgreSQL 14",r:"唯讀副本",v:0.51,st:"健康"},
      {n:"AUTH_REDIS",e:"Redis 7.2",r:"快取",v:0.33,st:"健康"}
    ];
    function stag(s){return s==="健康"?'<span class="tag t-ok">健康</span>':s==="觀察"?'<span class="tag t-warn">觀察</span>':'<span class="tag t-bad">告警</span>';}
    var list="";
    for(var i=0;i<inst.length;i++){var it=inst[i];var col=it.v>0.85?'#dc2626':it.v>0.7?'#d97706':'#0369a1';
      list+='<div class="inst"><div class="ic"><span class="material-symbols-outlined">database</span></div>'+
        '<div style="min-width:0"><div class="nm">'+it.n+'</div><div class="mt">'+it.e+' ｜ '+it.r+'</div></div>'+
        '<div class="rt"><div style="font-size:11px;color:#5b7385;font-weight:700;text-align:right">基準負載 '+Math.round(it.v*100)+'%</div>'+
        '<div class="bar" style="width:120px;margin-top:6px"><i style="width:'+Math.round(it.v*100)+'%;background:'+col+'"></i></div></div>'+
        '<div style="flex:0 0 auto">'+stag(it.st)+'</div></div>';
    }
    view.innerHTML=
    '<div class="grid k4" style="margin-bottom:16px">'+
      kpi("納管實例","dns","42","個","+3 本月","up")+
      kpi("已建立基準","fact_check","38","個","90.5% 覆蓋","up")+
      kpi("待納管","pending_actions","4","個","評估中","flat")+
      kpi("資料庫可用率","verified","99.98","%","近30日","up")+
    '</div>'+
    '<div class="grid c23">'+
      '<div class="card"><div class="ch"><span class="material-symbols-outlined">account_tree</span><h3>納管實例清冊</h3><span class="r">共 6 / 42 顯示</span></div>'+list+'</div>'+
      '<div class="card"><div class="ch"><span class="material-symbols-outlined">donut_large</span><h3>資料庫引擎分佈</h3></div><div id="c0a" class="chart"></div></div>'+
    '</div>'+
    '<div class="card" style="margin-top:16px"><div class="ch"><span class="material-symbols-outlined">insights</span><h3>近 6 週納管實例與基準覆蓋</h3><span class="sub">實例數 vs 已建立基準</span></div><div id="c0b" class="chart"></div></div>';
    void view.offsetHeight;
    mk("c0a",{chart:{type:"donut",height:250},labels:["商用資料庫 B","商用資料庫 A","PostgreSQL","MySQL","Redis"],series:[14,8,11,6,3],colors:["#0369a1","#38bdf8","#0ea5e9","#7dd3fc","#0891b2"],legend:{position:"bottom",fontSize:"12px"},dataLabels:{enabled:true,formatter:function(v){return Math.round(v)+"%";}},stroke:{width:2},plotOptions:{pie:{donut:{size:"62%"}}}});
    mk("c0b",{chart:{type:"line",height:280},series:[{name:"納管實例",data:[31,34,36,38,40,42]},{name:"已建立基準",data:[24,28,31,34,36,38]}],colors:[ACC,ACC2],stroke:{width:3,curve:"smooth"},markers:{size:4},xaxis:{categories:["W1","W2","W3","W4","W5","W6"]},yaxis:{min:0},grid:{borderColor:"#eef2f6"},legend:{position:"top"},dataLabels:{enabled:false}});
  }

  // ---------- SCREEN 1 : 效能監控 ----------
  function s1(){
    var alerts=[
      {t:"WMS_MYSQL 連線數逼近上限 (462/500)",lv:"高",tm:"3 分鐘前",m:"連線池"},
      {t:"ERP_CORE_ORA 鎖等待時間 > 1.8s",lv:"中",tm:"12 分鐘前",m:"鎖等待"},
      {t:"CRM_PROD_MSSQL 緩衝命中率降至 91%",lv:"中",tm:"26 分鐘前",m:"緩衝"},
      {t:"ANALYTICS_PG 副本延遲 4.2s",lv:"低",tm:"41 分鐘前",m:"複寫延遲"}
    ];
    function lvt(l){return l==="高"?'<span class="tag t-bad">高</span>':l==="中"?'<span class="tag t-warn">中</span>':'<span class="tag t-info">低</span>';}
    var arows=alerts.map(function(a){return[a.t,'<span class="tag t-mut">'+a.m+'</span>',lvt(a.lv),'<span class="mono">'+a.tm+'</span>'];});
    // heatmap 24h x 6 instances
